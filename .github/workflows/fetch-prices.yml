name: Fetch prices

on:
  schedule:
    - cron: '0 2 * * *' # 每天 02:00 UTC（北京时间 10:00）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只抓取并打印结果，不提交数据'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run fetch
      - name: Commit price changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          # Distinguish real price moves from timestamp/FX-only refreshes in the commit log.
          if git diff --cached --name-only | grep -q changes.json; then
            git commit -m "data: price changes $(date -u +%F)"
          else
            git commit -m "data: refresh $(date -u +%F)"
          fi
          git push
